# Analytical Data Model - ocean-breeze-tier-3.manuscript_live
# Narrow Data Model (NDM) - Version 2
# NDM scope: keys (_id columns), primary keys, and foreign keys only.
# Generated: 2026-04-10
# Updated:   2026-04-10  — FK scope migration: foreign_key → foreign_keys list with scope.
# Source: dataset-model-ADM/ocean-breeze-tier-3.manuscript_live_ADM_V2.yaml
#
# -- Join rules ----------------------------------------------------------------
# - space_id is an implicit second join condition wherever the grain includes it.
# - When joining two tables within the dataset, space_id is not strictly
#   required - the primary key is sufficient.
# - When crossing into external datasets, use XXX_original + space_id.
# - If space_id is absent in a table, filter by space_id = 1 in the table
#   that does carry space_id as a safety measure.
#
# -- FK cardinality conventions ------------------------------------------------
# many_to_one          : many rows here -> same parent row (standard FK)
# one_to_one           : at most one row here per referenced parent row
# optional_many_to_one : FK is nullable / zero-or-one participation
# [PROPOSED]           : inferred - validate before use
# -----------------------------------------------------------------------------

entities:

  ######################## ARTICLE ########################

  - name: content_type
    domain: ARTICLE
    source_table: ocean-breeze-tier-3.manuscript_live.ContentType
    description: "Mapping with the ContentTypeId and its meaning."
    grain: Id
    primary_key: Id
    columns:
      - name: Id
        type: Integer
      - name: ContentTypeId
        type: Integer

  - name: extractedManuscriptMetadata
    domain: ARTICLE
    source_table: ocean-breeze-tier-3.manuscript_live.extractedManuscriptMetadata
    description: "Contains PDF only data extracted from submitted manuscripts (using Grobid engine)."
    grain: _id
    primary_key: _id
    columns:
      - name: _id
        type: Integer
      - name: articleId
        type: Integer

  - name: file_format
    domain: ARTICLE
    source_table: ocean-breeze-tier-3.manuscript_live.FileFormat
    description: "Mapping with the FileFormatId and its meaning."
    grain: Id
    primary_key: Id
    columns:
      - name: Id
        type: Integer
      - name: FileFormatId
        type: Integer
      - name: ContentTypeId
        type: Integer

  - name: manuscript
    domain: ARTICLE
    source_table: ocean-breeze-tier-3.manuscript_live.manuscript
    description: "Contains data inserted by the user at the time of submission."
    grain: _id
    primary_key: _id
    columns:
      - name: _id
        type: Integer
      - name: articleId
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: article
            column: article_id_original
            cardinality: many_to_one
            relationship: "[PROPOSED] references"
      - name: submissionId
        type: Integer
      - name: articleTypeId
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: article_type
            column: article_type_id
            cardinality: many_to_one
            relationship: "[PROPOSED] references"
      - name: journalId
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: journal
            column: journal_id
            cardinality: many_to_one
            relationship: "[PROPOSED] references"
      - name: sectionId
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: section
            column: section_id
            cardinality: many_to_one
            relationship: "[PROPOSED] references"
      - name: domainId
        type: Integer
      - name: fieldId
        type: Integer
      - name: specialtyId
        type: Integer
      - name: das.statementMessageId
        type: String
      - name: ethicsStatements.animalSubjects.statementMessageId
        type: String
      - name: ethicsStatements.humanSubjects.statementMessageId
        type: String
      - name: ethicsStatements.identifiableHumanData.statementMessageId
        type: String
      - name: versionHistory.submissionHistoryId
        type: Integer
      - name: versionHistory.files.fileUploadId
        type: Integer
      - name: versionHistory.files.fileServerFileId
        type: String
      - name: versionHistory.files.contentTypeId
        type: Integer
      - name: imageQuality.fileUploadId
        type: Integer

