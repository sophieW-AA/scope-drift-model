entities:


  ####################################################### RESEARCHER #######################################################

  - name: enhanced_profiles_validated
    domain: RESEARCHER
    source_table: ocean-breeze-tier-1.ai_enhanced_profile.enhanced_profiles_validated
    description: >
      AI Generated Profiles of authors. One row per validated AI-generated
      researcher profile. Each profile is keyed on aira_id, which is the AIRAK
      AuthorId of the researcher. Provides expertise, career stage, publishing
      interests, ORCID, institutional affiliation, and quality / decision labels
      used to assess profile confidence.
    grain: aira_id
    primary_key: aira_id
    columns:
      - name: aira_id
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.airak
            entity: author
            column: AuthorId
            cardinality: one_to_one
            relationship: "is the enhanced profile of"
