# Analytical Data Model — ocean-breeze-tier-2.senscience
# Narrow Data Model (NDM) — Version 1
# NDM scope: keys (_id columns), primary keys, and foreign keys only.
# Generated: 2026-04-03
# Updated:   2026-04-10  — FK scope migration: foreign_key → foreign_keys list with scope.
# Source: ocean-breeze-tier-2.senscience_ADM_V1.yaml
#
# ── Join rules ────────────────────────────────────────────────────────────────
# • space_id is an implicit second join condition wherever the grain includes it.
# • When joining two tables within the dataset, space_id is not strictly
# required — the primary key is sufficient.
# • When crossing into external datasets, use XXX_original + space_id.
# • If space_id is absent in a table, filter by space_id = 1 in the table
# that does carry space_id as a safety measure.
#
# ── FK cardinality conventions ────────────────────────────────────────────────
# many_to_one         : many rows here → same parent row (standard FK)
# one_to_one          : at most one row here per referenced parent row
# optional_many_to_one: FK is nullable / zero-or-one participation
# [PROPOSED]          : inferred — validate before use
# ─────────────────────────────────────────────────────────────────────────────

entities:

  ######################## UNKNOWN ########################

  - name: event
    domain: ARTICLE
    source_table: ocean-breeze-tier-2.senscience.event
    description: "Table containing all Frontiers-specific events emitted by the SENSCIENCE platform."
    grain: space_id, submission_id
    primary_key: space_id, submission_id
    columns:
      - name: space_id
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: space
            column: space_id
            cardinality: many_to_one
            relationship: " is part of"
      - name: submission_id
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: article
            column: first_submission_id_original
            cardinality: many_to_one
            relationship: "is the first submission of"
      - name: publication_id
        type: String
        # UUID — no confirmed join to DWH article/DOI; see integration map SENS-001.
      - name: user_id
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: user_metrics
            column: user_id
            cardinality: many_to_one
            relationship: "user of the event"
