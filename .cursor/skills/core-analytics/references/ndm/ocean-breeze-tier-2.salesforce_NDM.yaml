#
# ── Join rules ────────────────────────────────────────────────────────────────
# • space_id is an implicit second join condition wherever the grain includes it.
# • Salesforce uses SpaceId__c (Salesforce record Id GUID) not integer space_id.
#   There is no direct integer FK to reporting_data_mart.space from this dataset.
# • All custom Frontiers fields (ArticleId__c, LoopId__c, etc.) are stored as
#   STRING in Salesforce; use SAFE_CAST(col AS INT64) when joining to DWH.
#
# ── FK cardinality conventions ────────────────────────────────────────────────
# many_to_one         : many rows here → same parent row (standard FK)
# one_to_one          : at most one row here per referenced parent row
# optional_many_to_one: FK is nullable / zero-or-one participation
# [PROPOSED]          : inferred — validate before use
# ─────────────────────────────────────────────────────────────────────────────
#
# ── Transform note ────────────────────────────────────────────────────────────
# transform: SAFE_CAST to INT64   →  column is STRING in SF; cast before joining.
# transform: SAFE_CAST to INT64 (FLOAT source) → column is FLOAT in SF (e.g. AIRAId__c).
