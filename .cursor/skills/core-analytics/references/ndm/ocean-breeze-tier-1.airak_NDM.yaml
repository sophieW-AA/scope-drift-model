  - name: research_topic_contributor
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicContributor
    description: >
      Contains data on the contributors of a research topic
    grain: ResearchTopicId, AuthorId
    primary_key: ResearchTopicId, AuthorId
    columns:
