        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "contributes to research topic"
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "contributes to research topic"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: research_topic_contributor_source
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicContributorSource
    description: >
