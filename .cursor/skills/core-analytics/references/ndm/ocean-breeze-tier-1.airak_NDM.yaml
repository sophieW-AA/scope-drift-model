    grain: ContributorSourceId, SourceId
    primary_key: ContributorSourceId, SourceId
    columns:
      - name: ContributorSourceId
        type: Integer
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: research_topic_contributor_status
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicContributorStatus
    description: >
      Show the status of the RT contribution, some values are Pending, Declined, Confirmed or Withdrawn
    grain: ContributorStatusId, SourceId
    primary_key: ContributorStatusId, SourceId
    columns:
      - name: ContributorStatusId
        type: Integer
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: research_topic_description
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicDescription
    description: >
      Contains descriptions for all RTs
    grain: ResearchTopicId
    primary_key: ResearchTopicId
    columns:
      - name: ResearchTopicId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "has information on"

  - name: research_topic_keyword
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicKeyword
    description: >
      Contains Keywords for all RTs
    grain: ResearchTopicKeywordId
    primary_key: ResearchTopicKeywordId
    columns:
      - name: ResearchTopicKeywordId
        type: Integer
      - name: ResearchTopicId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "references"

  - name: research_topic_publication
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicPublication
    description: >
      Lists the publicatios contained in an RT
    grain: ResearchTopicId, PublicationId
    primary_key: ResearchTopicId, PublicationId
    columns:
      - name: ResearchTopicId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "has information on"
      - name: PublicationId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: publication
            column: PublicationId
            cardinality: many_to_one
