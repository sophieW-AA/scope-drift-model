# Analytical Data Model — ocean-breeze-tier-1.airak
# Narrow Data Model (NDM) — Version 2
# NDM scope: keys (_id columns), primary keys, and foreign keys only.
# Generated: 2026-04-03
# Source: ocean-breeze-tier-1.airak_ADM_V2.yaml
#
# ── Join rules ────────────────────────────────────────────────────────────────
# • space_id is an implicit second join condition wherever the grain includes it.
# • When joining two tables within the dataset, space_id is not strictly
#   required — the primary key is sufficient.
# • When crossing into external datasets, use XXX_original + space_id.
# • If space_id is absent in a table, filter by space_id = 1 in the table
#   that does carry space_id as a safety measure.
#
# ── FK cardinality conventions ────────────────────────────────────────────────
# many_to_one          : many rows here → same parent row (standard FK)
# one_to_one           : at most one row here per referenced parent row
# optional_many_to_one : FK is nullable / zero-or-one participation
# [PROPOSED]           : inferred — validate before use
# ─────────────────────────────────────────────────────────────────────────────

entities:


  ####################################################### COMMON #######################################################

  - name: country
    domain: COMMON
    source_table: ocean-breeze-tier-1.airak.Country
    description: >
      Contains metadata about countries.
    grain: IsoCode3
    primary_key: IsoCode3
    columns:
      - name: IsoCode3
        type: String
      - name: IsoCode2
        type: String

  - name: country_submission_metrics
    domain: COMMON
    source_table: ocean-breeze-tier-1.airak.CountrySubmissionMetrics
    description: >
      Contains submission and rejection metrics for countries.
    grain: CountryIsoCode3
    primary_key: CountryIsoCode3
    columns:
      - name: CountryIsoCode3
        type: String


  ####################################################### JOURNAL #######################################################

  - name: journal
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.Journal
    description: >
      Contains general information about a Journal
    grain: JournalId
    primary_key: JournalId
    columns:
      - name: JournalId
        type: Integer
      - name: PublisherId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: publisher
            column: PublisherId
            cardinality: many_to_one
            relationship: "is published by"

  - name: journal_field_of_study
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalFieldOfStudy
    description: >
      Contains data on what Fields of study are associated to a Journal. This is inferred through the publications published in the journal.
    grain: JournalId, FieldOfStudyId
    primary_key: JournalId, FieldOfStudyId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: many_to_one
            relationship: "has information on"
      - name: FieldOfStudyId
        type: Integer

  - name: journal_issn
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalIssn
    description: >
      Contains the ISSNs for Journals
    grain: JournalId
    primary_key: JournalId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: one_to_one
            relationship: "has information on"

  - name: journal_metadata
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalMetadata
    description: >
      Contains additional metrics like IsOpenAccess and IsOpenForSubmissions for all journals
    grain: JournalId
    primary_key: JournalId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: one_to_one
            relationship: "has information on"

  - name: journal_section
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalSection
    description: >
      Contains the Sections of Journals. This is only for Frontiers Journals and Tenant Journals.
    grain: JournalId, SectionId
    primary_key: JournalId, SectionId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: many_to_one
            relationship: "is a section of"
      - name: SectionId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: section
            column: SectionId
            cardinality: many_to_one
            relationship: "is a section of"

  - name: journal_source
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalSource
    description: >
      Shows the source from which the Journal data was gathered
    grain: JournalId, SourceId
    primary_key: JournalId, SourceId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: many_to_one
            relationship: "comes from source"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: journal_url
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.JournalUrl
    description: >
      List URLs for journals
    grain: JournalId
    primary_key: JournalId
    columns:
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: one_to_one
            relationship: "is the url of"

  - name: section
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.Section
    description: >
      Contains data on sections. This data only comes from Frontiers & other tenants
    grain: SectionId
    primary_key: SectionId
    columns:
      - name: SectionId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal_section
            column: SectionId
            cardinality: one_to_one
            relationship: "has information on"

  - name: section_field_of_study
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.SectionFieldOfStudy
    description: >
      Lists the Fields of study of the publications associated to a section
    grain: SectionId, FieldOfStudyId
    primary_key: SectionId, FieldOfStudyId
    columns:
      - name: SectionId
        type: Integer
      - name: FieldOfStudyId
        type: Integer

  - name: section_source
    domain: JOURNAL
    source_table: ocean-breeze-tier-1.airak.SectionSource
    description: >
      Shows the source from which the section contribution data was gathered
    grain: SectionId, SourceId
    primary_key: SectionId, SourceId
    columns:
      - name: SectionId
        type: Integer
      - name: SourceId
        type: Integer


  ####################################################### ARTICLE #######################################################

  - name: author
    domain: RESEARCHER
    source_table: ocean-breeze-tier-1.airak.Author
    description: >
      Contains general information about authors.
    grain: AuthorId
    primary_key: AuthorId
    columns:
      - name: AuthorId
        type: Integer


  - name: author_closest_frontiers_journal_rank
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorClosestFrontiersJournalRank
    description: >
      Shows the 10 closest frontiers journal for a given author,  the confidence and a rank that orders the journals (from 1 closest to 10 farthest)
    grain: AuthorId, JournalId
    primary_key: AuthorId, JournalId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: many_to_one
            relationship: "refers to journal"

  - name: author_closest_frontiers_section_rank
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorClosestFrontiersSectionRank
    description: >
      Shows the 10 closest frontiers sections for a given author, the confidence and a rank that orders the journals (from 1 closest to 10 farthest)
    grain: AuthorId, SectionId
    primary_key: AuthorId, SectionId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: SectionId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: section
            column: SectionId
            cardinality: many_to_one
            relationship: "refers to section"

  - name: author_data_privacy
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorDataPrivacy
    description: >
      Shows for what tenants the author has given consent to share their data
    grain: AuthorId, SourceId
    primary_key: AuthorId, SourceId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "refers to source"

  - name: author_email
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorEmail
    description: >
      Shows all emails assigned to an author, the validation status of the emails and if the email is the primary email.
    grain: AuthorId, ValidityId
    primary_key: AuthorId, ValidityId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: ValidityId
        type: Integer

  - name: author_email_history
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorEmailHistory
    description: >
      Contains metadata about the email history of authors.
    grain: AuthorId, EmailSourceId
    primary_key: AuthorId, EmailSourceId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: EmailSourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "refers to source"

  - name: author_exclusion
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorExclusion
    description: >
      Entity to centralize and standarise audience eligibility criteria. All the info: https://confluence.frontiersin.net/x/pgBLIg
    grain: AuthorId
    primary_key: AuthorId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"

  - name: author_exclusion_extended
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak_extended.AuthorExclusion
    description: >
       Extended view of author_exclusion sourced from airak_extended. One row per author. Excludes pipeline metadata columns (airak_version, _ocean_ingested_on).
    grain: AuthorId
    primary_key: AuthorId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"

  - name: author_field_of_study
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorFieldOfStudy
    description: >
      Shows the fields of study associated to an author, how many publications the author has linked to that FOS and how similar the FOS is to the author.
    grain: AuthorId, FieldOfStudyId
    primary_key: AuthorId, FieldOfStudyId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: FieldOfStudyId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: field_of_study
            column: FieldOfStudyId
            cardinality: many_to_one
            relationship: "refers to field of study"

  - name: author_grants
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorGrants
    description: >
      Contains information about grants associated with authors.
    grain: GrantId, AuthorId
    primary_key: GrantId, AuthorId
    columns:
      - name: GrantId
        type: Integer
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"

  - name: author_metric
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorMetric
    description: >
      Contains additional metrics like H5index, citation count and publication count for all eligible authors.
    grain: AuthorId, MainFieldOfStudyId
    primary_key: AuthorId, MainFieldOfStudyId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: MainFieldOfStudyId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: field_of_study
            column: FieldOfStudyId
            cardinality: many_to_one
            relationship: "refers to field of study"

  - name: author_organization
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorOrganization
    description: >
      Shows the Organizations to which the the author has been affilated to via his pubications
    grain: AuthorId, OrganizationId
    primary_key: AuthorId, OrganizationId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: OrganizationId
        type: Integer

  - name: author_overall_proximity
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorOverallProximity
    description: >
      How close an author is within Frontiers scope. Data used  to exclude out-of-Frontiers-scope people from campaigns and use them to analyse gaps in our portfolios and launch new sections/journals or expand boards.
    grain: AuthorId
    primary_key: AuthorId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"

  - name: author_rejections
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorRejections
    description: >
      This table contains the data related to an authors publication being rejected from Frontiers
    grain: AuthorId, FrontiersArticleId
    primary_key: AuthorId, FrontiersArticleId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: FrontiersArticleId
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: article
            column: article_id_original
            cardinality: many_to_one
            relationship: "refers to article"
      - name: loopid
        type: Integer
        foreign_keys:
          - scope: external
            dataset: ocean-breeze-tier-1.reporting_data_mart
            entity: user_metrics
            column: user_id
            cardinality: many_to_one
            relationship: "refers to user"


  - name: author_source
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorSource
    description: >
      This should be used in conjunction with the Source table. An author can have many rows in Author source, each row will represent an external identifier from a different system. For example, an author that has 2 dimensions profiles and one loop profile will have 3 rows in AuthorSource.
    grain: AuthorId, SourceId
    primary_key: AuthorId, SourceId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "refers to source"

  - name: author_source_history
    domain: ARTICLE
    source_table: ocean-breeze-tier-1.airak.AuthorSourceHistory
    description: >
      A small portion of Authors will eventually have their AuthorID altered, this is due to new data allowing us to correct the author's identity. This table is used to track down the new Id of an author that has undergone this change
    grain: AuthorId, FormerAuthorId
    primary_key: AuthorId, FormerAuthorId
    columns:
      - name: AuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to author"
      - name: FormerAuthorId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: author
            column: AuthorId
            cardinality: many_to_one
            relationship: "refers to former author"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"


  ####################################################### RESEARCH_TOPIC #######################################################

  - name: research_topic
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopic
