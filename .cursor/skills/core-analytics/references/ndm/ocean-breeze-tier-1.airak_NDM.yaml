  - name: research_topic_source
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicSource
    description: >
      Shows the source from which the RT data was gathered
    grain: ResearchTopicId, SourceId
    primary_key: ResearchTopicId, SourceId
    columns:
      - name: ResearchTopicId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "comes from source"
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: research_topic_stage
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicStage
    description: >
      Lists the stages for research topics
    grain: ResearchTopicStageId
    primary_key: ResearchTopicStageId
    columns:
      - name: ResearchTopicStageId
        type: Integer
      - name: SourceId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: source
            column: SourceId
            cardinality: many_to_one
            relationship: "comes from source"

  - name: research_topic_taxonomy
    domain: RESEARCH_TOPIC
    source_table: ocean-breeze-tier-1.airak.ResearchTopicTaxonomy
    description: >
      Lists the Journals and sections associated to an RT
    grain: ResearchTopicId, JournalId
    primary_key: ResearchTopicId, JournalId
    columns:
      - name: ResearchTopicId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: ResearchTopicId
            cardinality: many_to_one
            relationship: "references"
      - name: JournalId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: journal
            column: JournalId
            cardinality: many_to_one
            relationship: "references"
      - name: SectionId
        type: Integer
        foreign_keys:
          - scope: internal
            entity: section
            column: SectionId
            cardinality: many_to_one
            relationship: "references"


  ####################################################### ORGANIZATION #######################################################

  - name: organization
    domain: ORGANIZATION
    source_table: ocean-breeze-tier-1.airak.Organization
    description: >
      General information about organizations
    grain: OrganizationId
    primary_key: OrganizationId
    columns:
      - name: OrganizationId
        type: Integer

  - name: organization_flags
    domain: ORGANIZATION
    source_table: ocean-breeze-tier-1.airak.OrganizationFlags
    description: >
      These are tags associated to organizations some values are VIP, Watchlist, C42, CAS and Overreaching
    grain: OrganizationId, SourceId
    primary_key: OrganizationId, SourceId
    columns:
      - name: OrganizationId
        type: Integer
      - name: SourceId
        type: Integer

  - name: organization_hierarchy
    domain: ORGANIZATION
    source_table: ocean-breeze-tier-1.airak.OrganizationHierarchy
    description: >
      Lists the known child organizations for all organizations
    grain: OrganizationId, ChildOrganizationId
    primary_key: OrganizationId, ChildOrganizationId
    columns:
      - name: OrganizationId
        type: Integer
      - name: ChildOrganizationId
        type: Integer

  - name: organization_ranking
    domain: ORGANIZATION
    source_table: ocean-breeze-tier-1.airak.OrganizationRanking
    description: >
      Metadata about different rankings and the organizations in them
    grain: OrganizationId, RankingId
    primary_key: OrganizationId, RankingId
    columns:
      - name: OrganizationId
        type: Integer
