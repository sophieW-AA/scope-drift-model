      - name: user_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: user_metrics
            column: user_id
            cardinality: many_to_one
            relationship: "belongs to"
      - name: country_id
        type: String
        foreign_keys:
          - scope: internal
            entity: country
            column: country_id
            cardinality: many_to_one
            relationship: "located in"
      - name: user_primary_organization_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: organization
            column: organization_id
            cardinality: many_to_one
            relationship: "is part of"


