    columns:
      - name: contributor_id
        type: Integer
      - name: contributor_id_original
        type: Integer
      - name: contributor_space_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: space
            column: space_id
            cardinality: many_to_one
            relationship: "is part of"
      - name: contributor_user_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: user_metrics
            column: user_id
            cardinality: optional_many_to_one
            relationship: "is registered as"
      - name: contributor_research_topic_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: research_topic
            column: research_topic_id
            cardinality: many_to_one
            relationship: "contributes to"
      - name: contributor_taxonomy_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: taxonomy
            column: taxonomy_id
            cardinality: many_to_one
            relationship: "in context of"


####################################################### USER #######################################################

  - name: user_metrics
    domain: USER
    source_table: ocean-breeze-tier-1.reporting_data_mart.user_metrics
    description: >
      Various attributes (derived and sourced) at user level. One row per registered
            user. A user_id represents a person who has registered on the Frontiers
            platform. Includes profile data, role flags, engagement percentiles (AIRA
            scores: activity, connectivity, influence, productivity, trendiness), and
            organisation/country context.
    grain: user_id
    primary_key: user_id
    columns:
      - name: user_id
        type: Integer
      - name: country_id
        type: String
        foreign_keys:
          - scope: internal
            entity: country
            column: country_id
            cardinality: many_to_one
            relationship: "located in"

  - name: user_email
    domain: USER
    source_table: ocean-breeze-tier-1.reporting_data_mart.email_metrics
    description: >
      Various attributes (derived and sourced) at email level. One row per email
            address per user. Identifies unique instances of both registered and non-
            registered persons by email. Includes country, organisation, AIRA profile
            scores, and watchlist flags.
    grain: email, user_id
    primary_key: email, user_id
    columns:
      - name: email
