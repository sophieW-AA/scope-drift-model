        foreign_keys:
          - scope: internal
            entity: user_metrics
            column: user_id
            cardinality: many_to_one
            relationship: "campaign user"
      - name: campaign_member_taxonomy_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: taxonomy
            column: taxonomy_id
            cardinality: many_to_one
            relationship: "targeted at taxonomy"


####################################################### ORGANIZATION #######################################################

  - name: organization
    domain: ORGANIZATION
    source_table: ocean-breeze-tier-1.reporting_data_mart.organization
    description: >
          One row per organisation. This is the reporting_data_mart copy of
            organisation data, denormalised for reporting use. It includes address,
            country, type, and classification attributes. Note: the canonical
            organisation master is sourced from ocean-breeze-
            tier-2.rosst.organization; this table is the reporting-layer projection
            used for joins within this dataset.
    grain: organization_id
    primary_key: organization_id
    columns:
      - name: organization_id
        type: Integer
      - name: rosst_id
        type: String
        foreign_keys:
          - scope:  external
            dataset: ocean-breeze-tier-2.rosst
            entity: organization
            column: OrganizationId
            cardinality: many_to_one
            relationship: "is part of"
      - name: country_id
        type: String
        foreign_keys:
          - scope: internal
            entity: country
            column: country_id
            cardinality: many_to_one
            relationship: "located in"
      - name: continent_id
        type: String
