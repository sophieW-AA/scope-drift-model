            cardinality: many_to_one
            relationship: "is part of"
      - name: person_user_id
        type: Integer
        foreign_keys:
          - scope: internal
            entity: user_metrics
            column: user_id
            cardinality: optional_many_to_one
            relationship: "is registered as"
      - name: primary_organization_id
        type: Integer
        foreign_keys:
