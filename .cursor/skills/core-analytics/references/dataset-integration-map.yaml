editorial_board_cross_dataset_joins:

  - id: EB-001
    status: confirmed
    label: "DWH editorial_board_member → Salesforce EditorialBoardMember__c"
    from:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
