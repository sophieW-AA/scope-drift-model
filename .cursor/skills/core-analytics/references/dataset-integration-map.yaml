senscience_cross_dataset_joins:

  - id: SENS-001
    status: confirmed
    label: "senscience.event → reporting_data_mart.user_metrics (user_id) + space (space_id)"
    from:
      project: ocean-breeze-tier-2
      dataset: senscience
      table: event
      column: user_id
    to:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: user_metrics
      column: user_id
    join_key_pairs:
      - { from_col: user_id, to_col: user_id, transform: "direct" }
    join_type: direct
    cardinality: many_to_one
    filter: "Filter by space_id = 1 and is_deleted = FALSE."
    notes: >
      publication_id is a UUID from the ScienceRadar/data_vitae system — no confirmed
      join to DWH article or DOI. submission_id (7M range) confirmed via SENS-002
