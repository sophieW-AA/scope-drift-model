peer_review_cross_dataset_joins:

  - id: PR-001
    status: confirmed
    label: "Peer Review annotation → DWH article"
    from:
      project: ocean-breeze-tier-2
      dataset: peer_review
      table: annotation
      column: article_id   # = article_id_original, NOT internal article_id
    to:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: article
      column: article_id_original
    join_key_pairs:
      - { from_col: article_id, to_col: article_id_original }
      - { from_col: space_id, to_col: space_id }
    join_type: direct
    cardinality: many_to_one
    sample_query: |
      SELECT
        ann.annotation_id,
        ann.article_id    AS pr_article_id,
        ann.space_id,
        ann.user_id,
        ar.article_id_original,
        ar.article_id     AS dwh_internal_id,
        ar.doi,
        ar.title
      FROM `ocean-breeze-tier-2.peer_review.annotation` ann
      JOIN `ocean-breeze-tier-1.reporting_data_mart.article` ar
        ON ann.article_id = ar.article_id_original
        AND ann.space_id  = ar.space_id
      WHERE ann.is_deleted = FALSE
      LIMIT 5

  - id: PR-002
    status: confirmed
    label: "Peer Review review_turn → DWH article"
    from:
      project: ocean-breeze-tier-2
      dataset: peer_review
      table: review_turn
      column: article_id   # = article_id_original
    to:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: article
      column: article_id_original
    join_key_pairs:
      - { from_col: article_id, to_col: article_id_original }
      - { from_col: space_id, to_col: space_id }
    join_type: direct
    cardinality: many_to_one
    notes: review_turn.reviewer_id = DWH user_id (join to user_metrics).
