        rbm.review_board_member_user_id,
        rbm.review_board_member_article_id,
        sf.Id              AS sf_crm_id,
        sf.ArticleReviewerId__c,
        SAFE_CAST(sf.LoopId__c AS INT64) AS sf_loop_id,
        sf.Status__c
      FROM `ocean-breeze-tier-1.reporting_data_mart.review_board_member` rbm
      JOIN `ocean-breeze-tier-2.salesforce.ArticleReviewer__c` sf
        ON SAFE_CAST(sf.LoopId__c AS INT64) = rbm.review_board_member_user_id
      WHERE rbm.review_board_member_space_id = 1
        AND sf.SpaceId__c = 'a3G4K0000000CmXUAU'
      LIMIT 5

  - id: EB-003
    status: confirmed
    label: "DWH research_topic_editor → Salesforce ArticleEditor__c"
    from:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: research_topic_editor
