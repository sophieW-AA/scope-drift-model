organization_cross_dataset_joins:

  - id: ORG-001
    status: confirmed
    label: "ROSST organization ↔ DWH author_organizations"
    from:
      project: ocean-breeze-tier-2
      dataset: rosst
      table: organization
      column: OrganizationId   # O-prefixed string e.g. "O100034"
    to:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: author_organizations
      column: rosst_id
    join_key_pairs:
      - { from_col: OrganizationId, to_col: rosst_id }
    join_type: direct
    cardinality: one_to_many
    sample_query: |
      SELECT
        r.OrganizationId,
        r.Name           AS rosst_name,
        ao.author_organizations_id,
        ao.author_id,
        ao.organization
      FROM `ocean-breeze-tier-2.rosst.organization` r
      JOIN `ocean-breeze-tier-1.reporting_data_mart.author_organizations` ao
        ON ao.rosst_id = r.OrganizationId
      WHERE ao.space_id = 1
      LIMIT 5

  - id: ORG-002
    status: unconfirmed
    label: "AIRAK Organization → ROSST organization"
    notes: >
      INVESTIGATION FINDING: No direct join path confirmed.
      AIRAK OrganizationSource (SourceId=23) stores numeric IDs;
      AIRAK OrganizationSource (SourceId=24) stores GRID IDs.
      Neither matches ROSST's O-prefixed OrganizationId format.
      Recommended workaround: bridge via DWH —
      airak.PublicationAuthor.OrganizationId → reporting_data_mart.author_organizations.organization_id
      (this also did not confirm during testing, suggesting the AIRAK org ID
      is a different namespace from DWH organization_id).
      Further investigation needed with data engineering team.

  - id: ORG-003
    status: confirmed
    label: "Production Forum institution → ROSST organization"
    from:
      project: ocean-breeze-tier-2
      dataset: production_forum
      table: institution
      column: rosst_id
    to:
      project: ocean-breeze-tier-2
      dataset: rosst
      table: organization
      column: OrganizationId
    join_key_pairs:
      - { from_col: rosst_id, to_col: OrganizationId }
    join_type: direct
    cardinality: many_to_one
    notes: Bridge via production_forum.author_institution to link authors to institutions.
    sample_query: |
      SELECT
        inst.id         AS pof_institution_id,
        inst.name       AS pof_inst_name,
        inst.rosst_id,
        r.OrganizationId,
        r.Name          AS rosst_name
      FROM `ocean-breeze-tier-2.production_forum.institution` inst
      JOIN `ocean-breeze-tier-2.rosst.organization` r
        ON inst.rosst_id = r.OrganizationId
      WHERE inst.rosst_id IS NOT NULL
      LIMIT 5

