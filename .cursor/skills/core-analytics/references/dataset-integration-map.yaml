        rt.review_turn_id,
        rt.article_id     AS pr_article_id,
        rt.reviewer_id,
        rt.round_number,
        ar.article_id_original,
        ar.doi,
        ar.title
      FROM `ocean-breeze-tier-2.peer_review.review_turn` rt
      JOIN `ocean-breeze-tier-1.reporting_data_mart.article` ar
        ON rt.article_id = ar.article_id_original
        AND rt.space_id  = ar.space_id
      LIMIT 5

###############################################################################
# 10. SENSCIENCE — cross-dataset joins
