      column: submission_id
    to:
      project: ocean-breeze-tier-1
      dataset: reporting_data_mart
      table: article
      column: first_submission_id_original
    join_key_pairs:
      - { from_col: submission_id, to_col: first_submission_id_original, transform: "direct" }
      - { from_col: space_id, to_col: space_id, transform: "direct" }
    join_type: direct
    cardinality: many_to_one
    notes: >
      senscience.event.submission_id (range 6.5M–7.5M) is a short submission ID
      matching article.first_submission_id_original (not article_id_original 1–1.8M,
      and not submission_article_id which is a 16-digit composite key).
      An article may have multiple submissions; the event ties to whichever submission
      the ScienceRadar event references — confirmed match is on first_submission_id_original.
      Use latest_submission_id_original for an alternative join if the event refers
      to the latest revision.
    filter: "Filter by space_id = 1 and is_deleted = FALSE."
    sample_query: |
      SELECT
        ev.submission_id,
        ar.article_id_original,
        ar.first_submission_id_original,
        ar.latest_submission_id_original,
        ev.space_id,
        ev.name AS event_name
      FROM `ocean-breeze-tier-2.senscience.event` ev
      JOIN `ocean-breeze-tier-1.reporting_data_mart.article` ar
        ON ev.submission_id = ar.first_submission_id_original
       AND ev.space_id = ar.space_id
      WHERE ev.space_id = 1
        AND ev.is_deleted = FALSE
      LIMIT 5
