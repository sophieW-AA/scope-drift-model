<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scope Drift Analysis Dashboard</title>
<style>
:root {
  --bg: #f6f8fa;
  --card: #ffffff;
  --text: #1a1f36;
  --muted: #5f6b7c;
  --border: #e3e7ee;
  --blue: #2c5fa3;
  --blue-light: #e8f0fe;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}
.header {
  background: var(--card);
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 1.3rem; font-weight: 700; }
.header .meta { color: var(--muted); font-size: 0.85rem; }
.tab-nav {
  display: flex;
  gap: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  flex-shrink: 0;
}
.tab-btn {
  padding: 14px 24px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 500;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); background: var(--bg); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); background: var(--blue-light); }
.tab-content { flex: 1; display: none; overflow: hidden; }
.tab-content.active { display: block; }
.tab-content iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<div class="header">
  <h1>Scope Drift Analysis</h1>
  <div class="meta">Run: 20260714_151745 · Generated: 2026-07-15 14:52 UTC · 3 dashboards</div>
</div>
<nav class="tab-nav">
  <button class="tab-btn active" data-tab="scope_dashboard">Scope Analysis</button>
  <button class="tab-btn " data-tab="drift_dashboard">Drift Analysis</button>
  <button class="tab-btn " data-tab="clusters">Cluster Map</button>
</nav>

<div id="tab-scope_dashboard" class="tab-content active">
  <iframe data-src="scope_dashboard.html" title="Scope Analysis"></iframe>
</div>

<div id="tab-drift_dashboard" class="tab-content ">
  <iframe data-src="drift_dashboard.html" title="Drift Analysis"></iframe>
</div>

<div id="tab-clusters" class="tab-content ">
  <iframe data-src="clusters.html" title="Cluster Map"></iframe>
</div>
<script>
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tabId = btn.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
  });
});
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tabId = btn.dataset.tab;
    const iframe = document.querySelector('#tab-' + tabId + ' iframe');
    if (iframe && !iframe.src && iframe.dataset.src) {
      iframe.src = iframe.dataset.src;
    }
  });
});
const firstIframe = document.querySelector('.tab-content.active iframe');
if (firstIframe && firstIframe.dataset.src) {
  firstIframe.src = firstIframe.dataset.src;
}
</script>
</body>
</html>
